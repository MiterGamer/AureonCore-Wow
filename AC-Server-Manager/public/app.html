<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Server Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="titlebar" id="titlebar">
    <div class="titlebar-title"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>AC Server Manager</span></div>
    <div class="titlebar-controls">
        <button class="tb-btn tb-minimize" onclick="window.electronAPI.minimize()"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 12h12"/></svg></button>
        <button class="tb-btn tb-close" onclick="window.electronAPI.close()"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </div>
</div>
<div class="app-container">
    <nav class="sidebar">
        <div class="sidebar-header"><div class="logo"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>AC Manager</span></div></div>
        <ul class="nav-menu">
            <li class="nav-item active" data-page="dashboard"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span data-i18n="nav_dashboard">Dashboard</span></li>
            <li class="nav-item" data-page="server"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2 2h20v20H2V2zm2 2v8h8V4H4zm8 0v8h8V4h-8zM4 14v8h8v-8H4zm8 0v8h8v-8h-8z"/></svg><span data-i18n="nav_server">Server</span></li>
            <li class="nav-item" data-page="setup"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span data-i18n="nav_setup">Server Setup</span></li>
            <li class="nav-item" data-page="config"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58z"/></svg><span data-i18n="nav_config">Konfiguration</span></li>
            <li class="nav-item" data-page="logs"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg><span data-i18n="nav_logs">Logs</span></li>
            <li class="nav-item" data-page="players"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span data-i18n="nav_players">Spieler</span></li>
            <li class="nav-item" data-page="backups"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg><span data-i18n="nav_backups">Backups</span></li>
            <li class="nav-item" data-page="rights"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12 0-4.41-2.69-8.15-6.44-9.79z"/></svg><span data-i18n="nav_rights">Rechte</span></li>
            <li class="nav-item" data-page="settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58z"/></svg><span data-i18n="nav_settings">Einstellungen</span></li>
        </ul>
        <div class="sidebar-footer"><button class="btn btn-sm btn-secondary logout-btn" onclick="logout()"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg><span data-i18n="nav_logout">Abmelden</span></button></div>
    </nav>
    <main class="main-content">
        <header class="top-bar">
            <div class="page-title"><h1 id="pageTitle">Dashboard</h1></div>
            <div class="status-bar">
                <select id="serverSelect" class="lang-select" onchange="selectServerProfile(this.value)" aria-label="Server"></select>
                <select id="langSelect" class="lang-select" onchange="setLang(this.value)"><option value="de">DE</option><option value="en">EN</option><option value="tr">TR</option><option value="fr">FR</option><option value="es">ES</option></select>
                <div class="status-indicator" id="statusIndicator"><span class="status-dot"></span><span id="statusText" data-i18n="auth_connected">Verbunden</span></div>
            </div>
        </header>
        <div class="content-area">
            <div id="page-dashboard" class="page active"></div>
            <div id="page-server" class="page"></div>
            <div id="page-setup" class="page"></div>
            <div id="page-config" class="page"></div>
            <div id="page-logs" class="page"></div>
            <div id="page-players" class="page"></div>
            <div id="page-backups" class="page"></div>
            <div id="page-rights" class="page"></div>
            <div id="page-settings" class="page"></div>
        </div>
    </main>
</div>
<div class="notification" id="notification"><div class="notification-content"><span class="notification-icon"></span><span class="notification-message"></span></div></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
